name: MiniOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Syntax Validation, Tests & Container Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 3. Install Dependencies (Clean Install)
        working-directory: app
        run: npm ci

      - name: 4. Dependency Security Audit
        working-directory: app
        run: npm audit --audit-level=high

      - name: 5. Code Syntax & Integrity Validation
        working-directory: app
        run: npm run lint

      - name: 6. Execute Automated Test Suite
        working-directory: app
        run: npm test

      - name: 7. Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 8. Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: miniops-demo-app:latest
